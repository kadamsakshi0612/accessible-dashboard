<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enterprise dashboard settings">
    <title>Settings - Enterprise Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">

    <div class="header-left">

        <button
            type="button"
            class="menu-button"
            id="menuButton"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="sidebar">
            ☰
        </button>

        <a href="../index.html" class="logo">
            Enterprise Dashboard
        </a>

    </div>

    <nav aria-label="User navigation">

        <ul class="header-nav">

            <li>
                <a href="settings.html" aria-current="page">
                    Settings
                </a>
            </li>

            <li>
                <button type="button" aria-label="Open profile menu">
                    Profile
                </button>
            </li>

        </ul>

    </nav>

</header>

<div class="dashboard-layout">

    <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">

        <nav aria-label="Primary navigation">

            <h2 class="visually-hidden">Primary navigation</h2>

            <ul class="sidebar-menu">

                <li>
                    <a href="../index.html">Dashboard</a>
                </li>

                <li>
                    <a href="users.html">Users</a>
                </li>

                <li>
                    <a href="reports.html">Reports</a>
                </li>

                <li>
                    <a href="settings.html" class="active" aria-current="page">
                        Settings
                    </a>
                </li>

            </ul>

        </nav>

    </aside>

    <main id="main-content" class="main-content">

        <section aria-labelledby="settings-title">

            <p class="eyebrow">Configuration</p>

            <h1 id="settings-title">Settings</h1>

            <p>Manage your dashboard preferences.</p>

        </section>

        <section aria-labelledby="preferences-title">

            <article class="form-card">

                <h2 id="preferences-title">Account Preferences</h2>

                <form>

                    <fieldset>

                        <legend>Profile information</legend>

                        <div class="form-group">

                            <label for="displayName">
                                Display name
                            </label>

                            <input
                                type="text"
                                id="displayName"
                                name="displayName"
                                value="Admin User"
                                autocomplete="name"
                                required>

                        </div>

                        <div class="form-group">

                            <label for="settingsEmail">
                                Email address
                            </label>

                            <input
                                type="email"
                                id="settingsEmail"
                                name="settingsEmail"
                                value="admin@example.com"
                                autocomplete="email"
                                required>

                        </div>

                    </fieldset>

                    <fieldset>

                        <legend>Notification preferences</legend>

                        <div class="checkbox-group">

                            <input
                                type="checkbox"
                                id="emailNotifications"
                                name="emailNotifications"
                                checked>

                            <label for="emailNotifications">
                                Receive email notifications
                            </label>

                        </div>

                        <div class="checkbox-group">

                            <input
                                type="checkbox"
                                id="securityAlerts"
                                name="securityAlerts"
                                checked>

                            <label for="securityAlerts">
                                Receive security alerts
                            </label>

                        </div>

                    </fieldset>

                    <fieldset>

                        <legend>Dashboard theme</legend>

                        <div class="radio-group">

                            <input
                                type="radio"
                                id="lightTheme"
                                name="theme"
                                value="light"
                                checked>

                            <label for="lightTheme">
                                Light theme
                            </label>

                        </div>

                        <div class="radio-group">

                            <input
                                type="radio"
                                id="darkTheme"
                                name="theme"
                                value="dark">

                            <label for="darkTheme">
                                Dark theme
                            </label>

                        </div>

                    </fieldset>

                    <button type="submit" class="primary-button">
                        Save settings
                    </button>

                </form>

            </article>

        </section>

    </main>

</div>

<footer class="site-footer">
    <p>&copy; 2026 Enterprise Dashboard.</p>
</footer>

<script src="../js/app.js"></script>

</body>
</html>
